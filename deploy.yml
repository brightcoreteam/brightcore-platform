name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site
        run: npm run check

      # Work out the base path automatically:
      #   <owner>.github.io  -> served from the domain root  -> "/"
      #   any other repo     -> served from a sub-path       -> "/<repo>/"
      # A custom domain always serves from the root, so set the repository
      # variable SITE_URL (Settings -> Secrets and variables -> Actions ->
      # Variables) and BASE_PATH is forced to "/" as well.
      - name: Resolve base path and site URL
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            echo "SITE_URL=$CUSTOM_SITE_URL" >> "$GITHUB_ENV"
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
            case "$REPO_NAME" in
              *.github.io) echo "BASE_PATH=/" >> "$GITHUB_ENV" ;;
              *)           echo "BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Build site
        env:
          BASE_PATH: ${{ env.BASE_PATH }}
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          echo "Building with BASE_PATH=$BASE_PATH SITE_URL=$SITE_URL"
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
